# ExampleMod tag to use as Blowdryer (Spotless, etc.) settings version, leave empty to disable.
# LOCAL can be used to test local config updates.
gtnh.settings.blowdryerTag = 0.2.2

# Human-readable library name. This satisfies the GTNH build plugin and does not make MCLib a standalone mod.
modName = MCLib

# Case-sensitive identifier string used by the GTNH build plugin. MCLib remains a shaded library.
modId = makamys.mclib

# Root package of the library, used by structure checks and publishing metadata.
modGroup = makamys.mclib

# Whether to use modGroup as the Maven publishing group.
# When false, com.github.GTNewHorizons is used.
useModGroupForPublishing = true

# Updates build.gradle.kts and settings.gradle.kts automatically whenever an update is available.
autoUpdateBuildScript = false

# Version of Minecraft to target.
minecraftVersion = 1.7.10

# Version of Minecraft Forge to target.
forgeVersion = 10.13.4.1614

# Specify an MCP channel for dependency deobfuscation and the deobfParams task.
channel = stable

# Specify an MCP mappings version for dependency deobfuscation.
mappingsVersion = 12

# Defines other MCP mappings for dependency deobfuscation.
remoteMappings = https\://raw.githubusercontent.com/MinecraftForge/FML/1.7.10/conf/

# Select a default username for development run tasks if the plugin creates them.
developmentEnvironmentUserName = Developer

# Enables modern Java syntax support. Valid values:
# - false: No modern syntax, Java 8 only
# - jabel: Jabel syntax-only support, compiles to Java 8 bytecode
# - jvmDowngrader: Full modern Java via JVM Downgrader
# - modern: Native modern Java bytecode, no downgrading
enableModernJavaSyntax = false

# If set, ignores the above setting and compiles with the given toolchain. -1 disables this.
# forceToolchainVersion = -1

# JVM Downgrader is disabled. Keep these documented for future migration only.
# downgradeTargetVersion = 8

# JVM Downgrader is disabled. Multi-release downgraded jars are not generated.
# jvmDowngraderMultiReleaseVersions = 17,21,25

# JVM Downgrader is disabled. No downgraded API stubs are used.
# jvmDowngraderStubsProvider = shade

# Enables injecting missing generics into the decompiled source code for a better coding experience.
enableGenericInjection = true

# Do not generate a token class; MCLib keeps its existing @VERSION@ replacement flow.
generateGradleTokenClass =

# No generated token field is required.
gradleTokenVersion =

# Deprecated token replacement is disabled for this library.
gradleTokenModId =
gradleTokenModName =
replaceGradleTokenInFile =

# MCLib does not split a separate API package in this build.
apiPackage =

# MCLib does not ship access transformers.
accessTransformersFile =

# MCLib does not use Mixins.
usesMixins = false

# No separate Mixin source set.
separateMixinSourceSet =

# No Mixin debug arguments.
usesMixinDebug = false

# No Mixin config plugin.
mixinPlugin =

# No Mixin package.
mixinsPackage =

# MCLib is not a coremod.
coreModClass =

# MCLib is a shaded library, not a standalone Forge mod.
containsMixinsAndOrCoreModOnly = true

# Do not force Mixin support for this library.
forceEnableMixins = false

# No shadow plugin is used; embedded jars are handled by the jar task.
usesShadowedDependencies = false

# Keep default minimization setting for projects that later enable shadowing.
minimizeShadowedDependencies = true

# Keep default relocation setting for projects that later enable shadowing.
relocateShadowedDependencies = true

# Adds CurseMaven, Modrinth, and common 1.7.10 repositories.
includeWellKnownRepositories = true

# No well-known repositories are excluded.
excludeWellKnownRepositories =

# Publish as a Maven library artifact.
usesMavenPublishing = true

# MCLib is not published to Modrinth by this build.
modrinthProjectId =
modrinthRelations =

# MCLib is not published to CurseForge by this build.
curseForgeProjectId =
curseForgeRelations =

# Preserve historical artifact naming through build.gradle.kts.
# customArchiveBaseName =

# Do not disable Spotless; spotlessApply is part of validation.
# disableSpotless = true

# Keep Checkstyle available unless the project needs to disable it explicitly.
# disableCheckstyle = true

# Avoid GTNH modern run-client integration; MCLib is a library.
gtnh.modules.modernJava = false

# Avoid IDE run configuration generation for a standalone mod.
gtnh.modules.ideIntegration = false

# Avoid automatic buildscript update tasks in this library migration.
gtnh.modules.updater = false

# Non-GTNH properties.
org.gradle.configuration-cache = true
org.gradle.parallel = true
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
